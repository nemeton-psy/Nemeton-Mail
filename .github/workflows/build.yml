name: App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            platform: macos-15-intel
            args: --target universal-apple-darwin
            bundle: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows
            platform: windows-latest
            args: ""
            bundle: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # Jede Version landet auch unter „Releases“ – mit fester Adresse
          # für die neueste Version: …/releases/latest
          tagName: v__VERSION__
          releaseName: Nemeton Mail __VERSION__
          releaseBody: "Mac: die Datei mit .dmg herunterladen. Windows: die Datei mit -setup.exe herunterladen."
          releaseDraft: false
          prerelease: false

      - uses: actions/upload-artifact@v4
        with:
          name: Nemeton-Mail-${{ matrix.name }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
